## Exemple de configuration de la base de données
# Copier ce fichier en 'config.properties' et renseigner les valeurs.

# Adresse du serveur
db.host=localhost
db.port=3306
db.name=lego_db

# Identifiants
db.user=your_login
db.password=your_password

# URL JDBC complète (optionnel si vous composez vous-même)
db.url=jdbc:mysql://localhost:3306/lego_db?useSSL=false&serverTimezone=UTC

# Exemple d'utilisation :
# mvn -Ddb.config=sae/config.properties test
